
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# sync, thread
tokio = { version = "1.43.0", features = ["full"] }
once_cell = "1.21.1"
reqwest = "0.12.22"
async-trait = "0.1.89"
crossbeam = "0.8.4"

#data
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
serde_json = "1.0.140"
serde = { version = "1.0.218", features = ["derive"] }
toml = "0.8.20"

# common
eyre = "0.6.12"
thiserror = "2.0.12"
dotenv = "0.15.0"
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.15.19"
uuid = "1.19.0"